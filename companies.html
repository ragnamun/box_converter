<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>업체 가공비 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f2f1ee; --surface: #fff; --surface2: #f7f6f4;
  --border: #e6e3de; --border2: #ccc8c0;
  --text: #1c1a18; --text2: #6a6560; --text3: #aaa69e;
  --accent: #1d4035; --accent2: #2d5c4e;
  --accent-light: #e8f2ee; --accent-mid: #c0d9d0;
  --danger: #b93232; --danger-light: #fdf0f0;
  --sw: #1a3358; --sw-light: #eef2f8;
  --dw: #5c3d10; --dw-light: #faf3e8;
}
html { -webkit-text-size-adjust: 100%; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

.top-bar { background: var(--accent); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; }
.back-btn { background: rgba(255,255,255,0.15); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; padding: 6px 12px; cursor: pointer; }
.back-btn:hover { background: rgba(255,255,255,0.25); }
.top-bar h1 { font-size: 16px; font-weight: 700; color: #fff; flex: 1; }
.count-badge { font-size: 12px; font-weight: 700; color: var(--accent); background: rgba(255,255,255,0.9); border-radius: 20px; padding: 3px 10px; }

.page { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.sec-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }

/* 입력 폼 */
.form-name { margin-bottom: 10px; }
.form-name label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
.form-costs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.cost-group { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.cost-group-label { font-size: 10px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.cg-sw { color: var(--sw); }
.cg-dw { color: var(--dw); }
.cg-box { color: var(--accent2); }
.cg-dot { width: 7px; height: 7px; border-radius: 50%; }
.dot-sw  { background: var(--sw); }
.dot-dw  { background: var(--dw); }
.dot-box { background: var(--accent2); }
.field-row { display: flex; flex-direction: column; gap: 4px; }
.field-row label { font-size: 10px; color: var(--text3); font-weight: 500; }

input[type="text"], input[type="number"] {
  width: 100%; height: 36px; padding: 0 9px;
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  background: #fff; border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); outline: none; -webkit-appearance: none;
}
input:focus { border-color: var(--accent2); }
input::placeholder { color: var(--text3); }

.input-unit { display: flex; }
.input-unit input { border-radius: 7px 0 0 7px; border-right: none; flex: 1; }
.ubadge { height: 36px; padding: 0 7px; background: var(--accent-light); border: 1px solid var(--accent-mid); border-left: none; border-radius: 0 7px 7px 0; font-size: 10px; font-weight: 600; color: var(--accent2); display: flex; align-items: center; white-space: nowrap; }

.add-btn { width: 100%; height: 42px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: background 0.15s; }
.add-btn:hover { background: var(--accent2); }

/* 업체 목록 */
.company-list { display: flex; flex-direction: column; gap: 8px; }

.company-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
}
.company-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.company-name { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
.edit-btn { font-size: 11px; font-weight: 600; padding: 4px 10px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface); color: var(--text2); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.edit-btn:hover { border-color: var(--accent2); color: var(--accent); }
.del-btn-co { font-size: 11px; font-weight: 600; padding: 4px 10px; border: 1px solid var(--border2); border-radius: 6px; background: var(--surface); color: var(--text3); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.del-btn-co:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

.company-costs { display: grid; grid-template-columns: repeat(3, 1fr); }
.cost-cell { padding: 10px 14px; border-right: 1px solid var(--border); }
.cost-cell:last-child { border-right: none; }
.cost-cell-label { font-size: 10px; font-weight: 700; margin-bottom: 4px; }
.cost-cell-val { font-size: 14px; font-weight: 700; }
.label-sw  { color: var(--sw); }
.label-dw  { color: var(--dw); }
.label-box { color: var(--accent2); }
.val-sw  { color: var(--sw); }
.val-dw  { color: var(--dw); }
.val-box { color: var(--accent2); }
.cost-cell-unit { font-size: 10px; font-weight: 400; color: var(--text3); }

.empty-msg { text-align: center; padding: 30px; color: var(--text3); font-size: 13px; }

/* 편집 모달 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; }
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; height: 40px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
.modal-btn.save { background: var(--accent); color: #fff; }
.modal-btn.cancel { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← 계산기</button>
  <h1>업체 가공비 관리</h1>
  <span class="count-badge" id="countBadge">0개</span>
</div>

<div class="page">

  <!-- 추가 폼 -->
  <div class="card">
    <div class="sec-label">업체 추가</div>
    <div class="form-name">
      <label>업체 이름</label>
      <input type="text" id="fName" placeholder="예) 대한판지">
    </div>
    <div class="form-costs">
      <!-- SW 원단가공비 -->
      <div class="cost-group">
        <div class="cost-group-label cg-sw"><div class="cg-dot dot-sw"></div>원단 가공비 SW</div>
        <div class="field-row">
          <label>단골 (A·B·E골)</label>
          <div class="input-unit"><input type="number" id="fSwSheet" placeholder="0" min="0"><span class="ubadge">원/㎡</span></div>
        </div>
      </div>
      <!-- DW 원단가공비 -->
      <div class="cost-group">
        <div class="cost-group-label cg-dw"><div class="cg-dot dot-dw"></div>원단 가공비 DW</div>
        <div class="field-row">
          <label>이중골 (BA·BB·EB)</label>
          <div class="input-unit"><input type="number" id="fDwSheet" placeholder="0" min="0"><span class="ubadge">원/㎡</span></div>
        </div>
      </div>
      <!-- 상자 가공비 -->
      <div class="cost-group">
        <div class="cost-group-label cg-box"><div class="cg-dot dot-box"></div>상자 가공비</div>
        <div class="field-row">
          <label>매당</label>
          <div class="input-unit"><input type="number" id="fBoxCost" placeholder="0" min="0"><span class="ubadge">원/매</span></div>
        </div>
      </div>
    </div>
    <button class="add-btn" onclick="addCompany()">+ 업체 추가</button>
  </div>

  <!-- 목록 -->
  <div class="card" style="padding:14px 0;">
    <div style="padding:0 14px 10px;" class="sec-label">등록 업체</div>
    <div class="company-list" id="companyList"></div>
  </div>

</div>

<!-- 편집 모달 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">업체 정보 수정</div>
    <div class="form-name">
      <label>업체 이름</label>
      <input type="text" id="eName" placeholder="업체명">
    </div>
    <div class="form-costs" style="margin-top:10px">
      <div class="cost-group">
        <div class="cost-group-label cg-sw"><div class="cg-dot dot-sw"></div>원단 SW</div>
        <div class="input-unit"><input type="number" id="eSwSheet" min="0"><span class="ubadge">원/㎡</span></div>
      </div>
      <div class="cost-group">
        <div class="cost-group-label cg-dw"><div class="cg-dot dot-dw"></div>원단 DW</div>
        <div class="input-unit"><input type="number" id="eDwSheet" min="0"><span class="ubadge">원/㎡</span></div>
      </div>
      <div class="cost-group">
        <div class="cost-group-label cg-box"><div class="cg-dot dot-box"></div>상자</div>
        <div class="input-unit"><input type="number" id="eBoxCost" min="0"><span class="ubadge">원/매</span></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn save" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
var STORAGE_KEY = 'companies_v1';
var editingId = null;

function goBack() { location.href = 'index.html'; }

function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
function save(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function addCompany() {
  var name    = document.getElementById('fName').value.trim();
  var swSheet = parseFloat(document.getElementById('fSwSheet').value) || 0;
  var dwSheet = parseFloat(document.getElementById('fDwSheet').value) || 0;
  var boxCost = parseFloat(document.getElementById('fBoxCost').value) || 0;
  if (!name) { alert('업체 이름을 입력해 주세요.'); return; }
  var list = load();
  if (list.find(function(c){ return c.name === name; })) {
    if (!confirm('"' + name + '" 업체가 이미 있습니다. 덮어쓸까요?')) return;
    list = list.filter(function(c){ return c.name !== name; });
  }
  list.push({ id: Date.now(), name: name, swSheet: swSheet, dwSheet: dwSheet, boxCost: boxCost });
  save(list);
  ['fName','fSwSheet','fDwSheet','fBoxCost'].forEach(function(id){ document.getElementById(id).value = ''; });
  render();
}

function deleteCompany(id) {
  var list = load();
  var co = list.find(function(c){ return c.id === id; });
  if (!co) return;
  if (!confirm('"' + co.name + '" 업체를 삭제할까요?')) return;
  save(list.filter(function(c){ return c.id !== id; }));
  render();
}

function openEdit(id) {
  var co = load().find(function(c){ return c.id === id; });
  if (!co) return;
  editingId = id;
  document.getElementById('eName').value    = co.name;
  document.getElementById('eSwSheet').value = co.swSheet || '';
  document.getElementById('eDwSheet').value = co.dwSheet || '';
  document.getElementById('eBoxCost').value = co.boxCost || '';
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  var name    = document.getElementById('eName').value.trim();
  var swSheet = parseFloat(document.getElementById('eSwSheet').value) || 0;
  var dwSheet = parseFloat(document.getElementById('eDwSheet').value) || 0;
  var boxCost = parseFloat(document.getElementById('eBoxCost').value) || 0;
  if (!name) { alert('업체 이름을 입력해 주세요.'); return; }
  var list = load().map(function(c) {
    return c.id === editingId ? { id: c.id, name: name, swSheet: swSheet, dwSheet: dwSheet, boxCost: boxCost } : c;
  });
  save(list);
  closeModal();
  render();
}

function render() {
  var list = load();
  document.getElementById('countBadge').textContent = list.length + '개';
  var el = document.getElementById('companyList');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-msg">등록된 업체가 없습니다</div>';
    return;
  }
  el.innerHTML = list.map(function(co) {
    return '<div class="company-card">' +
      '<div class="company-card-header">' +
        '<span class="company-name">' + co.name + '</span>' +
        '<button class="edit-btn" onclick="openEdit(' + co.id + ')">수정</button>' +
        '<button class="del-btn-co" onclick="deleteCompany(' + co.id + ')">삭제</button>' +
      '</div>' +
      '<div class="company-costs">' +
        '<div class="cost-cell">' +
          '<div class="cost-cell-label label-sw">원단 SW</div>' +
          '<div class="cost-cell-val val-sw">' + fmt(co.swSheet || 0) + '<span class="cost-cell-unit"> 원/㎡</span></div>' +
        '</div>' +
        '<div class="cost-cell">' +
          '<div class="cost-cell-label label-dw">원단 DW</div>' +
          '<div class="cost-cell-val val-dw">' + fmt(co.dwSheet || 0) + '<span class="cost-cell-unit"> 원/㎡</span></div>' +
        '</div>' +
        '<div class="cost-cell">' +
          '<div class="cost-cell-label label-box">상자 가공비</div>' +
          '<div class="cost-cell-val val-box">' + fmt(co.boxCost || 0) + '<span class="cost-cell-unit"> 원/매</span></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* 모달 외부 클릭 닫기 */
document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* 엔터 */
document.getElementById('fName').addEventListener('keydown', function(e) { if (e.key==='Enter') addCompany(); });

render();
</script>
</body>
</html>
